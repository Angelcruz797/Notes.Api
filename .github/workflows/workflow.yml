name: Deploy to Dev

on:
#  pull_request:
#    types: [opened, synchronize, reopened, ready_for_review, closed]
#    branches: [develop]

  push:
    branches: [feat-dockerfile]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-build --configuration Release

  publish:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: build-and-test
#    if: github.event.pull_request.merged == true

    env:
      REGISTRY: registry.angel-cruz.net
      IMAGE_NAME: notes-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
#    if: github.event.pull_request.merged == true

    steps:
      - name: Trigger Dokploy deployment
        run: curl -X POST "${{ secrets.DOKPLOY_DEPLOY_URL_DEV }}"
